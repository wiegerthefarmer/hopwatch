# hopwatch collector configuration
#
# Every target is traced from every enabled source (local + each Globalping location).
# `name` becomes the "target" label in metrics, so keep it stable.

targets:
  - name: lobot-https
    host: lobot.cs.queensu.ca # hostname only; the /healthz check is in blackbox (victoriametrics/scrape.yml)
    protocol: tcp # icmp (default) | tcp | udp
    port: 443
  - name: qscfirewall
    host: 130.15.1.1
  - name: qscweb-https
    host: cs.queensu.ca
    protocol: tcp # icmp (default) | tcp | udp
    port: 443
  # - name: my-server
  #   host: example.com
  #   ip_version: 4       # force IPv4/IPv6 (Globalping: hostnames only)

local:
  enabled: true
  source: kingston # label value; rename to where this box lives, e.g. "home" or "office"
  interval: 60 # seconds between runs per target
  cycles: 10 # probes per hop per run (mtr -c); a run takes roughly this many seconds
  asn_lookup: false # adds AS numbers via DNS lookups to Team Cymru
  max_parallel: 4

globalping:
  # Remote mtr from https://globalping.io probes. Each result = 1 test.
  # Anonymous limit is 250 tests/hour; set GLOBALPING_TOKEN in .env for more.
  # Budget: locations x targets x (3600 / interval). Below: 2 x 3 x 4 = 24/h.
  enabled: true
  interval: 900
  packets: 3 # 1-16
  locations:
    # Shorthand: `- Frankfurt` makes the source label "gp-frankfurt".
    # Or set the label explicitly with name + magic (city, country, ASN, cloud region, combos with +).
    - name: gp-egypt
      magic: Egypt # all Egyptian probes are in Cairo (Vodafone, Huawei Cloud, LightNode)
    - name: gp-toronto
      magic: Toronto+Bell # pinned to one ISP; plain "Toronto" picks from ~50 probes on many networks
    # No Globalping probes in Kingston, ON (Sep 2026); the local source covers it.
